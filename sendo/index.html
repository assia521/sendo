<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f2"><title>Sendo — شارك لحظتك</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="app.js"></script></head><body><header><a class="brand" href="#"> <span class="mark">s</span> sendo<span>.</span></a><input id="search" placeholder="ابحث في المنشورات" aria-label="بحث"><button id="account" class="avatar">س</button></header><main><aside><h2>مساحتك</h2><p id="status">وضع المعاينة</p><button id="signin">تسجيل الدخول</button><button id="openChat">✉ المراسلة الخاصة</button><p class="hint">للنشر والمراسلة بين الأجهزة، أضف إعدادات Supabase واتبع دليل README.</p></aside><section><div class="welcome"><small>مساحة دافئة لك</small><h1>أهلاً بك في <span>Sendo</span></h1><p>مكانك لمشاركة ما تحب، بالطريقة التي تحبها.</p></div><article class="composer"><textarea id="content" placeholder="ما الذي تود مشاركته اليوم؟"></textarea><div id="preview" hidden></div><div class="compose-row"><div><label class="attach">▧ صورة<input id="image" type="file" accept="image/*" hidden></label><label class="attach">▷ فيديو<input id="video" type="file" accept="video/*" hidden></label><button class="attach" id="record">♫ تسجيل صوتي</button></div><button id="publish" class="primary">انشر</button></div></article><div class="feed-title"><h2>آخر الحكايات</h2><button id="sort">الأحدث</button></div><div id="feed"></div></section></main><nav class="mobile-nav"><button id="homeNav">⌂<small>الرئيسية</small></button><button id="chatNav">✉<small>الرسائل</small></button><button id="composeNav">＋<small>منشور جديد</small></button></nav>
<dialog id="auth"><form id="authForm"><button class="close" type="button" data-close="auth">×</button><h2 id="authHeading">تسجيل الدخول</h2><label id="nameWrap" hidden>الاسم<input id="name" autocomplete="name"></label><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><p id="authError" class="error" hidden></p><button class="primary" id="authSubmit">دخول</button><p><button id="modeSwitch" type="button" class="link">إنشاء حساب جديد</button></p><button type="button" data-close="auth" class="secondary">إغلاق</button></form></dialog>
<dialog id="chat"><div class="chat-head"><div><small>رسائل خاصة</small><h2>محادثاتك</h2></div><button class="close" data-close="chat">×</button></div><div class="chat-layout"><div class="people"><div class="new-chat"><input id="peopleSearch" placeholder="ابحث بالاسم أو البريد"><button id="findPeople">بحث</button></div><div id="peopleList"></div></div><div class="conversation"><div id="chatEmpty" class="empty">اختر شخصاً لبدء محادثة خاصة.</div><div id="conversationView" hidden><div class="conversation-title" id="conversationTitle"></div><div id="messages" class="messages"></div><form id="messageForm"><input id="messageInput" maxlength="2000" placeholder="اكتب رسالة…" autocomplete="off" required><button class="primary">إرسال ↗</button></form></div></div></div></dialog><div id="toast" role="status"></div></body></html>
